<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<!-- Stricter than the transcript page: images and media may only come from the preview cache host, never from the network. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src https://preview.local; media-src https://preview.local; connect-src 'none'; frame-src 'none'; object-src 'none'; form-action 'none'; base-uri 'none'">
<meta name="referrer" content="no-referrer">
<style>
:root{color-scheme:light dark;--accent:#0078d4;--fg:#1a1a1a;--bg:#f9f9f9;--code:#f3f3f3;--icode:#ebebeb;--line:#e0e0e0;--sys:#616161;--link:color-mix(in srgb,var(--accent) 80%,#000)}
@media (prefers-color-scheme: dark){:root{--fg:#ffffff;--bg:#202020;--code:#1a1a1a;--icode:#383838;--line:#404040;--sys:#adadad;--link:color-mix(in srgb,var(--accent) 55%,#fff)}}
html,body{margin:0;height:100%;font:14px/1.5 "Segoe UI Variable Text","Segoe UI",sans-serif;color:var(--fg);background:var(--bg)}
#root{box-sizing:border-box;min-height:100%;padding:12px 16px;overflow-wrap:anywhere}
pre.src{margin:0;font:12.5px/1.45 Consolas,monospace;white-space:pre-wrap;word-break:break-word}
.md p{margin:4px 0 8px}.md ul,.md ol{margin:4px 0 8px;padding-left:24px}
.md pre{background:var(--code);border-radius:4px;padding:8px 10px;overflow-x:auto;font:12.5px Consolas,monospace}
.md code{font-family:Consolas,monospace}.md p code,.md li code,.md td code{background:var(--icode);padding:0 3px;border-radius:2px}
.md table{border-collapse:collapse;margin:6px 0}.md th,.md td{border:1px solid var(--line);padding:3px 8px;text-align:left}
.md .al-center{text-align:center}.md .al-right{text-align:right}.md .al-left{text-align:left}
.md blockquote{margin:4px 0 8px 8px;padding-left:10px;border-left:3px solid var(--line);color:var(--sys)}
.md h1{font-size:22px;margin:12px 0 6px}.md h2{font-size:18px;margin:12px 0 6px}.md h3,.md h4{font-size:15px;margin:10px 0 4px}
.md a{color:var(--link);cursor:pointer}.md a.blocked{color:inherit;text-decoration:none;cursor:default}
img.pimg,video.pvid{display:block;max-width:100%;max-height:calc(100vh - 40px);margin:0 auto;border-radius:6px}
</style>
</head>
<body>
<div id="root"></div>
<script src="preview.js"></script>
</body>
</html>
