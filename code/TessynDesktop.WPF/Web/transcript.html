<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src https://media.local; media-src https://preview.local; connect-src 'none'; frame-src 'none'; object-src 'none'; form-action 'none'; base-uri 'none'">
<meta name="referrer" content="no-referrer">
<style>
:root{color-scheme:light dark;--accent:#0078d4;--fg:#1a1a1a;--bg:#f9f9f9;--asst:#ffffff;--sys:#616161;--comp:#fff4ce;--compb:#d6b656;--code:#f3f3f3;--icode:#ebebeb;--line:#e0e0e0;--hdr:#616161;--user:color-mix(in srgb,var(--accent) 14%,var(--bg));--auto:color-mix(in srgb,#00897b 20%,var(--bg));--autoh:#00695c;--link:color-mix(in srgb,var(--accent) 80%,#000)}
@media (prefers-color-scheme: dark){:root{--fg:#ffffff;--bg:#202020;--asst:#2b2b2b;--sys:#adadad;--comp:#433519;--compb:#8a6d1c;--code:#1a1a1a;--icode:#383838;--line:#404040;--hdr:#adadad;--user:color-mix(in srgb,var(--accent) 28%,var(--bg));--auto:color-mix(in srgb,#26a69a 30%,var(--bg));--autoh:#80cbc4;--link:color-mix(in srgb,var(--accent) 55%,#fff)}}
html,body{margin:0;height:100%;overflow:hidden;font:14px/1.45 "Segoe UI Variable Text","Segoe UI",sans-serif;color:var(--fg);background:var(--bg)}
#vp{position:absolute;inset:0;overflow-y:auto;overflow-anchor:none}
.e{padding:4px 10px}
.e .c{border-radius:8px;border:1px solid var(--line);padding:5px 10px;overflow-wrap:anywhere}
.e.U .c{background:var(--user);border-color:transparent;margin-left:50px}
.e.U.auto .c{background:var(--auto)}
.e.U.auto .h{color:var(--autoh);font-weight:600}
.e .c.sel{outline:1px dotted var(--fg);outline-offset:2px}
.e.A .c{background:var(--asst);margin-right:50px}
.e.S .c{padding:2px 8px;font-size:12px;border-color:transparent;color:var(--sys);margin:0 20px}
.e.C .c{background:var(--comp);border:1px solid var(--compb)}
.h{font-size:11px;color:var(--hdr);margin-bottom:3px}
.e.C .h{font-weight:bold}
.b p{margin:2px 0 4px}.b ul,.b ol{margin:2px 0 4px;padding-left:22px}.b li{margin:0}
.b pre{background:var(--code);border-radius:4px;padding:6px 8px;margin:3px 0 5px;overflow-x:auto;font:12px Consolas,monospace}
.b code{font-family:Consolas,monospace}.b p code,.b li code,.b td code{background:var(--icode);padding:0 2px}
.b table{border-collapse:collapse;margin:4px 0 6px}.b th,.b td{border:.5px solid var(--line);padding:2px 6px;text-align:left;max-width:420px}
.b th{font-weight:600}.b .al-center{text-align:center}.b .al-right{text-align:right}.b .al-left{text-align:left}
.b blockquote{margin:2px 0 4px 10px;color:var(--sys)}
.b h1{font-size:19px;margin:6px 0 3px}.b h2{font-size:16px;margin:6px 0 3px}.b h3,.b h4{font-size:14px;margin:6px 0 3px}
.b a{color:var(--link);cursor:pointer}.b a.blocked{color:inherit;text-decoration:none;cursor:default}
a.more{display:inline-block;margin-top:3px;color:var(--link);cursor:pointer;font-size:12px}
mark{background:#ffeb3b;color:#000}mark.cur{background:var(--accent);color:#fff}
mark.ref{background:color-mix(in srgb,var(--accent) 40%,transparent);color:inherit;border-radius:2px;box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 40%,transparent)}
.e .c.refhl{outline:2px solid var(--accent);outline-offset:1px}
.mp{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}.ms{max-width:100%}
.mimg{display:block;max-width:100%;max-height:360px;border-radius:6px;border:1px solid var(--line)}.mvid{display:block;max-width:100%;max-height:360px;border-radius:6px}
.mfail{font-size:12px;color:var(--sys)}
.mload,.chip{font:12px "Segoe UI Variable Text","Segoe UI",sans-serif;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:3px 10px;cursor:pointer}
.mload:hover,.chip:hover{background:var(--icode)}
.lv{margin:4px 10px 12px;padding:6px 10px;border:1px dashed var(--line);border-radius:8px;color:var(--sys);font-size:13px}
.lh{display:flex;align-items:center;gap:6px;font-size:12px}.ld{width:8px;height:8px;border-radius:50%;background:var(--accent);animation:lp 1.2s ease-in-out infinite}
@keyframes lp{50%{opacity:.25}}
.lq{font-size:12px;opacity:.8;margin-bottom:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ltool{font:12px Consolas,monospace;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.ltool.done{opacity:.65}.ltool.err{color:#c42b1c}
.lk{font-style:italic;font-size:12px;margin-top:4px;max-height:3.6em;overflow:hidden;white-space:pre-wrap;opacity:.75}
.ltx{margin-top:6px;white-space:pre-wrap;overflow-wrap:anywhere;color:var(--fg)}
.lerr{margin-top:4px;color:#c42b1c;white-space:pre-wrap;overflow-wrap:anywhere}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}.chip{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:Consolas,monospace}
</style>
</head>
<body>
<div id="vp"><div id="padTop"></div><div id="items"></div><div id="padBot"></div><div id="live"></div></div>
<script src="media-gate.js"></script>
<script src="paging.js"></script>
<script src="inputnav.js"></script>
<script src="live.js"></script>
<script src="transcript.js"></script>
</body>
</html>
