# Tessyn Web vhost. Install as /etc/nginx/sites-available/tessyn.vvinogradoff.com and symlink into sites-enabled.
# Run `certbot --nginx -d tessyn.vvinogradoff.com` afterwards: certbot adds the listen 443 / ssl_certificate lines.

server {
    listen 80;
    listen [::]:80;
    server_name tessyn.vvinogradoff.com;

    client_max_body_size 10m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Long-lived SSE streams: browsers (events) and the desktop daemon (link stream).
    location ~ ^/(api/events|link/stream)$ {
        proxy_pass http://127.0.0.1:5320;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        proxy_pass http://127.0.0.1:5320;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
