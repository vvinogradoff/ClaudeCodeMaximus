# Tessyn Web vhost, as live on `safe` (/etc/nginx/sites-available/tessyn.vvinogradoff.com, symlinked into sites-enabled).
# The lines marked "managed by Certbot" were written by `certbot --nginx -d tessyn.vvinogradoff.com`; keep them.
# Always `sudo nginx -t` before `sudo systemctl reload nginx` - the box is shared with other sites.

server {
    server_name tessyn.vvinogradoff.com;
    client_max_body_size 4M;

    # Server-sent event streams: no buffering, long-lived
    location ~ ^/(api/events|link/stream)$ {
        proxy_pass         http://127.0.0.1:5320;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        # Overwrite (never append) so a client-supplied X-Forwarded-For cannot reach the app's throttle key.
        proxy_set_header   X-Forwarded-For $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        proxy_pass         http://127.0.0.1:5320;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection keep-alive;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    add_header Strict-Transport-Security "max-age=31536000" always;
    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/tessyn.vvinogradoff.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/tessyn.vvinogradoff.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = tessyn.vvinogradoff.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name tessyn.vvinogradoff.com;
    return 404; # managed by Certbot


}
